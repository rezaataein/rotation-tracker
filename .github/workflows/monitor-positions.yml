name: Monitor Positions & Strategies

on:
  # Run 3x daily during market hours (Eastern Time)
  schedule:
    - cron: '30 13 * * 1-5'  # 9:30 AM ET (1:30 PM UTC) - Market open
    - cron: '30 16 * * 1-5'  # 12:30 PM ET (4:30 PM UTC) - Midday
    - cron: '30 19 * * 1-5'  # 3:30 PM ET (7:30 PM UTC) - Before close

  # Allow manual trigger for testing
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '.github/scripts/requirements.txt'

      - name: Install dependencies
        run: |
          pip install -r .github/scripts/requirements.txt

      - name: Run monitor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python .github/scripts/monitor.py

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-logs-${{ github.run_id }}
          path: |
            *.log
          retention-days: 7
